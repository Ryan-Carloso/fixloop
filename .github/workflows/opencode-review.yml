name: opencode-review

# Automatic PR review with OpenCode (same setup as post-engineer).
#
# How it works:
# - Runs on GitHub-hosted runners — no VPS needed.
# - Installs the OpenCode CLI with the official install script, then runs
#   `opencode run` directly — no third-party GitHub Action wrapper.
#   (Verified against the installed CLI: there is no --standalone flag;
#   `run` is already the non-interactive command for scripts/CI.)
# - Tries the z.ai GLM Coding Plan first, then retries against z.ai's standard
#   API endpoint if that review fails. Both use the same ZAI_API_KEY secret.
# - Posts the review as a new PR comment on every push (the header carries
#   the head SHA), so each review round stays visible instead of overwriting
#   the previous one.
#
# Why pull_request_target:
# - GitHub does NOT pass secrets to `pull_request` workflows from forks, so
#   the ZAI_API_KEY check would always skip on fork PRs.
# - `pull_request_target` runs in the base repo context WITH secrets. The
#   checkout below is the BASE commit (trusted) — fork code is never
#   checked out: the diff under review is fetched via the GitHub API
#   (`gh pr diff`), so the agentic review step, which holds ZAI_API_KEY in
#   its environment, never runs with fork-controlled files on disk.
#
# Setup:
# 1. Add the `ZAI_API_KEY` secret (usable with both z.ai API endpoints).
#    Until the secret exists, the review steps are skipped.
# 2. If your Coding Plan uses a different model id, change OPENCODE_MODEL below.
# 3. If needed, change ZAI_STANDARD_MODEL to a model available on z.ai's
#    standard API.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel a superseded review when new pushes arrive.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Primary and fallback models, in provider/model form. Each provider id must
  # match the one configured before its corresponding review attempt.
  OPENCODE_MODEL: zai-coding-plan/glm-5.3-flash
  ZAI_STANDARD_MODEL: glm-5.3-flash

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout base repository (trusted context)
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # NOTE: do NOT check out the PR head here. In pull_request_target
          # workflows, checking out fork code requires the
          # allow-unsafe-pr-checkout opt-in, which would place
          # fork-controlled files in the working directory of the agentic
          # OpenCode review step below — and that step holds ZAI_API_KEY in
          # its environment. The PR diff is fetched via the GitHub API
          # instead, so fork code is never checked out or executed.

      - name: Check for z.ai API key
        id: check
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          if [ -z "${ZAI_API_KEY}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "ZAI_API_KEY secret is not set — skipping OpenCode review."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install OpenCode
        if: steps.check.outputs.has_key == 'true'
        run: |
          # The install script puts the binary in $HOME/.opencode/bin and
          # adds it to $GITHUB_PATH on its own.
          curl -fsSL https://opencode.ai/install | bash

      - name: Verify OpenCode install
        if: steps.check.outputs.has_key == 'true'
        run: opencode --version

      - name: Configure z.ai Coding Plan provider
        if: steps.check.outputs.has_key == 'true'
        run: |
          set -euo pipefail
          MODEL_ID="${OPENCODE_MODEL#*/}"
          python3 - "$MODEL_ID" <<'EOF'
          import json, sys
          model_id = sys.argv[1]
          config = {
              "$schema": "https://opencode.ai/config.json",
              "provider": {
                  "zai-coding-plan": {
                      "npm": "@ai-sdk/openai-compatible",
                      "name": "Z.AI GLM Coding Plan",
                      "options": {
                          "baseURL": "https://api.z.ai/api/coding/paas/v4",
                          "apiKey": "{env:ZAI_API_KEY}",
                      },
                      "models": {model_id: {"name": model_id}},
                  }
              },
          }
          with open("opencode.json", "w") as f:
              json.dump(config, f, indent=2)
          print("wrote opencode.json for model", model_id)
          EOF

      - name: Collect PR diff
        if: steps.check.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # FixLoop gitignores .env files, but strip any stray ones anyway so
          # the review agent never sees secrets.
          find . -path ./.git -prune -o -type f -name '.env*' -exec rm -f {} +
          gh pr diff "${{ github.event.pull_request.number }}" --patch > pr.diff
          # Keep the diff within a sane size for the model context.
          MAX_BYTES=200000
          SIZE=$(wc -c < pr.diff)
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" pr.diff > pr.diff.truncated
            printf '\n\n[... diff truncated at %s bytes ...]\n' "$MAX_BYTES" >> pr.diff.truncated
            mv pr.diff.truncated pr.diff
          fi
          wc -c pr.diff

      - name: Run OpenCode review with Coding Plan, then standard API fallback
        if: steps.check.outputs.has_key == 'true'
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # PR title is untrusted input: pass it through env and printf %s so
          # it can never break out of the quoted heredoc below (script injection).
          printf 'You are reviewing GitHub pull request #%s: "%s".\n' "$PR_NUMBER" "$PR_TITLE" > prompt.md
          cat >> prompt.md <<'EOF'
          A unified diff of the PR is attached to this message.

          Rules:
          - This is a READ-ONLY review. Do not modify, create, or delete any files. Do not run any command that changes state.
          - Write the entire review in English.
          - NEVER read, open, or quote `.env*`, `*.pem`, `*.key` files, or `**/secrets/**` / `**/private/**` paths.
          - Focus on: real bugs, security issues (especially secret leakage into logs, error messages, or client bundles), broken error handling, and type-safety violations (this repo uses strict TypeScript and forbids `any`).
          - This is a TDD repo: flag new or changed production logic that ships without test coverage.
          - Be concrete: file paths with line numbers, why it matters, and a suggested fix. Skip style nits.
          - Rate each finding as CRITICAL, MAJOR, or MINOR. If nothing material is wrong, say so briefly instead of inventing issues.
          - Output ONLY the review as markdown, with no preamble about your process.
          EOF
          if timeout 12m opencode run \
            --model "$OPENCODE_MODEL" \
            --file pr.diff \
            --title "PR #${{ github.event.pull_request.number }} review" \
            "$(cat prompt.md)" > review.md && [ -s review.md ]; then
            echo "Review completed with z.ai Coding Plan."
          else
            echo "Coding Plan review failed; retrying with z.ai standard API."
            MODEL_ID="$ZAI_STANDARD_MODEL" python3 <<'EOF'
          import json, os
          model_id = os.environ["MODEL_ID"]
          config = {
              "$schema": "https://opencode.ai/config.json",
              "provider": {
                  "zai-standard": {
                      "npm": "@ai-sdk/openai-compatible",
                      "name": "Z.AI Standard API",
                      "options": {
                          "baseURL": "https://api.z.ai/api/paas/v4",
                          "apiKey": "{env:ZAI_API_KEY}",
                      },
                      "models": {model_id: {"name": model_id}},
                  }
              },
          }
          with open("opencode.json", "w") as f:
              json.dump(config, f, indent=2)
          print("wrote opencode.json for standard z.ai model", model_id)
          EOF
            timeout 12m opencode run \
              --model "zai-standard/$ZAI_STANDARD_MODEL" \
              --file pr.diff \
              --title "PR #${{ github.event.pull_request.number }} review" \
              "$(cat prompt.md)" > review.md
            if [ ! -s review.md ]; then
              echo "OpenCode produced no output from either endpoint" >&2
              exit 1
            fi
          fi
          wc -c review.md

      - name: Post review as a new PR comment
        if: steps.check.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          HEAD_SHORT="${HEAD_SHA:0:7}"
          MARKER="<!-- opencode-review -->"
          # A new comment per push (never updated in place): each review round
          # stays visible as its own comment, with the head SHA in the header
          # so it is clear which push the review covers.
          {
            echo "$MARKER"
            echo "## OpenCode review (z.ai) — ${HEAD_SHORT}"
            echo ""
            cat review.md
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md
          echo "Posted new review comment for ${HEAD_SHORT}"
