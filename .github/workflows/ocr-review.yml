# OpenCodeReview (Alibaba OCR) — second AI code reviewer, running side by side
# with .github/workflows/opencode-review.yml for comparison testing.
# Fork-safe: runs as pull_request_target (secrets available). As audited at
# action SHA 486022d (2026-09-25), the OCR action checks out the trusted base
# and only fetches PR head blobs — it never materializes untrusted PR code
# into the working tree. Re-verify on any action bump.
# Accepted risk: untrusted PR diff text is fed to the LLM and its markdown
# output is posted back with pull-requests: write, so a crafted diff could
# steer the bot's posted content. Inherent to AI reviewers (same exposure
# as opencode-review.yml); accepted for this side-by-side test.
# LLM: same z.ai OpenAI-compatible endpoint + ZAI_API_KEY secret + model as the
# existing OpenCode review. Skips gracefully when the secret is not set.
# OCR posts its own sticky summary (marked <!-- ocr-summary -->) and inline
# comments, branded "OpenCodeReview"; the opencode review comment is untouched.

name: OCR Review (Alibaba OpenCodeReview)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ocr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ocr-review:
    # Drafts get no review; the ready_for_review trigger re-runs when marked ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for ZAI_API_KEY
        id: key-check
        env:
          ZAI_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          if [ -z "$ZAI_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ZAI_API_KEY secret is not set — skipping OCR review."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run OpenCodeReview
        if: steps.key-check.outputs.present == 'true'
        uses: alibaba/open-code-review@486022daaf14f7142275eddb9b3cacc3cc5dadfa # pinned 2026-09-25
        with:
          llm_url: https://api.z.ai/api/coding/paas/v4
          llm_auth_token: ${{ secrets.ZAI_API_KEY }}
          llm_model: glm-5.3-flash
          llm_use_anthropic: "false"
          # Pin the review engine: the action itself is SHA-pinned, but without
          # this the npm package would float on @latest in a privileged
          # pull_request_target context. Bump deliberately after checking
          # the changelog. (Latest known-good: 1.12.9 — verified against the
          # action's action.yml at pinned SHA 486022d on 2026-09-25; the input
          # drives the npm install of @alibaba-group/open-code-review.)
          ocr_version: "1.12.9"
