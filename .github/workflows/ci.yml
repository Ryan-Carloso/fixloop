name: ci

# Run the full verification suite on every PR and every push to master:
# typecheck, unit tests (vitest), and build.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  actionlint:
    # Static validation for GitHub Actions workflow files. Runs unprivileged
    # on pull_request (no secrets): a typo in an input name, expression, or
    # conditional in a privileged workflow (e.g. pull_request_target + write
    # scope) fails silently at runtime, so malformed workflow changes must
    # fail the PR visibly here instead.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1.77.0
